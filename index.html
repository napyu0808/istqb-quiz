<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ISTQB FL 퀴즈 · 공식 샘플문제 A</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;color:#e2e8f0}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
.fade{animation:fadeIn .3s ease}
.pop{animation:popIn .2s ease}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:99px}
table.qt{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0}
table.qt th,table.qt td{border:1px solid rgba(255,255,255,.2);padding:7px 9px;text-align:center}
table.qt th{background:rgba(255,255,255,.07);font-weight:700;color:#cbd5e1}
table.qt td:first-child{text-align:right;color:#cbd5e1;font-weight:600;background:rgba(255,255,255,.03)}
img.qimg{max-width:100%;border-radius:10px;background:#fff;padding:10px;margin:4px 0}
</style>
</head>
<body>
<div id="root"></div>

<script src="data/ch1.js"></script>
<script src="data/ch2.js"></script>
<script src="data/ch3.js"></script>
<script src="data/ch4.js"></script>
<script src="data/ch5.js"></script>
<script src="data/ch6.js"></script>

<script>
const BANK = window.BANK || [];

/* ── 챕터 정의 (출제 비율은 ISTQB 실제 시험 구조) ── */
const CHAPTERS=[
  {ch:1,label:"1장",tag:"테스팅의 기초",      color:"#6366f1",emoji:"📘",exam:8},
  {ch:2,label:"2장",tag:"SDLC와 테스팅",      color:"#8b5cf6",emoji:"📗",exam:6},
  {ch:3,label:"3장",tag:"정적 테스팅",        color:"#a855f7",emoji:"📙",exam:4},
  {ch:4,label:"4장",tag:"테스트 분석과 설계", color:"#ec4899",emoji:"📕",exam:11},
  {ch:5,label:"5장",tag:"테스트 활동 관리",   color:"#f59e0b",emoji:"📓",exam:9},
  {ch:6,label:"6장",tag:"테스트 도구",        color:"#22c55e",emoji:"📔",exam:2},
];
const EXAM_MODE={id:"exam",label:"실전 모의시험",tag:"40문항 · 60분 · 해설은 끝나고",color:"#ef4444",emoji:"⏱️"};
const ALL_MODE ={id:"all", label:"공식 전체",   tag:"본문 40 + 추가 26 = 66문항",      color:"#06b6d4",emoji:"🎯"};
const EXAM_N=40, PASS_PCT=65, EXAM_SEC=60*60;

const countCh=c=>BANK.filter(q=>q.ch===c).length;
const modeInfo=id=>{
  if(id==="exam")return EXAM_MODE;
  if(id==="all") return ALL_MODE;
  return CHAPTERS.find(c=>"ch"+c.ch===id);
};

function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x}

function buildQueue(mode){
  if(mode==="exam"){
    let out=[];
    CHAPTERS.forEach(c=>{out=out.concat(shuffle(BANK.filter(q=>q.ch===c.ch)).slice(0,c.exam));});
    return shuffle(out);
  }
  if(mode==="all") return shuffle(BANK);
  const ch=parseInt(mode.replace("ch",""),10);
  return shuffle(BANK.filter(q=>q.ch===ch));
}

/* ── 정답 판정 (단일/복수 공통) ── */
const ansArr=q=>Array.isArray(q.answer)?q.answer:[q.answer];
const isMulti=q=>Array.isArray(q.answer);
function isRight(q,picked){
  const a=ansArr(q);
  return picked.length===a.length && a.every(l=>picked.includes(l));
}

const e=React.createElement;
const {useState,useEffect,useRef}=React;

/* ── 스타일 헬퍼 ── */
const card={background:"rgba(30,41,59,.72)",backdropFilter:"blur(10px)",border:"1px solid rgba(255,255,255,.1)",borderRadius:"18px",padding:"26px",width:"100%",maxWidth:"760px",boxShadow:"0 18px 40px rgba(0,0,0,.4)"};
const secBtn={background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.15)",borderRadius:"9px",padding:"9px 18px",color:"#94a3b8",fontSize:"13px",cursor:"pointer"};
const primaryBtn=c=>({background:`linear-gradient(135deg,${c},${c}bb)`,border:"none",borderRadius:"12px",padding:"14px",color:"#fff",fontSize:"15px",fontWeight:700,cursor:"pointer",width:"100%",marginTop:"14px",boxShadow:`0 6px 18px ${c}40`});
function optBtn(show,isCorrect,isChosen){
  let bg="rgba(255,255,255,.05)",bd="rgba(255,255,255,.12)",col="#e2e8f0";
  if(show&&isCorrect){bg="rgba(34,197,94,.16)";bd="#22c55e";col="#bbf7d0";}
  else if(show&&isChosen&&!isCorrect){bg="rgba(239,68,68,.16)";bd="#ef4444";col="#fecaca";}
  else if(!show&&isChosen){bg="rgba(99,102,241,.2)";bd="#6366f1";col="#c7d2fe";}
  return{background:bg,border:`2px solid ${bd}`,borderRadius:"12px",padding:"13px 15px",color:col,fontSize:"14px",lineHeight:1.65,cursor:"pointer",textAlign:"left",width:"100%",transition:"all .15s"};
}
const badge=(txt,c)=>e("span",{key:txt,style:{fontSize:"10px",fontWeight:700,background:`${c}1f`,border:`1px solid ${c}55`,color:c,borderRadius:"99px",padding:"2px 8px",whiteSpace:"nowrap"}},txt);

/* ── 문항 지문 블록 (표 / 그림 / 매칭·조합 보기) ── */
function Stem({q}){
  const kids=[];
  if(q.scenario) kids.push(e("p",{key:"sc",style:{fontSize:"14px",lineHeight:1.85,color:"#cbd5e1",whiteSpace:"pre-line",marginBottom:"12px"}},q.scenario));
  if(q.table) kids.push(e("div",{key:"tb",style:{overflowX:"auto",marginBottom:"12px"}},
    e("table",{className:"qt"},
      e("thead",null,e("tr",null,...q.table.head.map((h,i)=>e("th",{key:i},h)))),
      e("tbody",null,...q.table.rows.map((r,i)=>e("tr",{key:i},...r.map((cl,j)=>e("td",{key:j},cl)))))
    )));
  if(q.image) kids.push(e("img",{key:"im",className:"qimg",src:q.image,alt:"문항 그림"}));
  if(q.stem&&q.stem.items) kids.push(e("div",{key:"it",style:{background:"rgba(255,255,255,.04)",borderRadius:"10px",padding:"12px 14px",marginBottom:"12px"}},
    ...q.stem.items.map((t,i)=>e("div",{key:i,style:{fontSize:"13.5px",lineHeight:1.9,color:"#cbd5e1"}},t))));
  if(q.stem&&q.stem.left) kids.push(e("div",{key:"mt",style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"12px"}},
    e("div",{style:{background:"rgba(255,255,255,.04)",borderRadius:"10px",padding:"12px"}},
      ...q.stem.left.map((t,i)=>e("div",{key:i,style:{fontSize:"13px",lineHeight:1.8,color:"#cbd5e1"}},t))),
    e("div",{style:{background:"rgba(255,255,255,.04)",borderRadius:"10px",padding:"12px"}},
      ...q.stem.right.map((t,i)=>e("div",{key:i,style:{fontSize:"13px",lineHeight:1.8,color:"#cbd5e1"}},t)))
  ));
  if(q.tail) kids.push(e("p",{key:"tl",style:{fontSize:"15px",fontWeight:700,lineHeight:1.8,color:"#e2e8f0",marginBottom:"4px"}},q.tail));
  return kids.length?e("div",null,...kids):null;
}

/* ── 해설 블록 ── */
function Why({q}){
  const letters=q.options.map(o=>o[0]);
  return e("div",{style:{marginTop:"15px",padding:"15px",background:"rgba(99,102,241,.1)",border:"1px solid rgba(99,102,241,.25)",borderRadius:"12px"}},
    e("div",{style:{fontSize:"13px",fontWeight:700,color:"#a5b4fc",marginBottom:"8px"}},`💡 정답: ${ansArr(q).join(", ")}`),
    q.explanation&&e("p",{style:{fontSize:"13.5px",lineHeight:1.8,color:"#c7d2fe",marginBottom:q.why?"10px":0,whiteSpace:"pre-line"}},q.explanation),
    q.why&&e("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}},
      ...letters.filter(l=>q.why[l]).map(l=>{
        const ok=ansArr(q).includes(l);
        return e("div",{key:l,style:{fontSize:"13px",lineHeight:1.75,color:ok?"#bbf7d0":"#cbd5e1",paddingLeft:"8px",borderLeft:`2px solid ${ok?"#22c55e":"rgba(255,255,255,.15)"}`}},
          e("strong",{style:{color:ok?"#22c55e":"#94a3b8"}},`${l}) `),q.why[l]);
      })
    ),
    e("div",{style:{marginTop:"10px",fontSize:"11px",color:"#64748b"}},`근거: 실러버스 ${q.ref} · ${q.lo} · ${q.k}`)
  );
}

/* ── Setup ── */
function Setup({onStart}){
  const [sel,setSel]=useState("ch1");
  const m=modeInfo(sel);
  const total=BANK.length;
  const btn=(md,id,sub)=>e("button",{key:id,onClick:()=>setSel(id),style:{
      background:sel===id?`${md.color}22`:"rgba(255,255,255,.04)",
      border:`2px solid ${sel===id?md.color:"rgba(255,255,255,.1)"}`,
      borderRadius:"13px",padding:"13px",cursor:"pointer",textAlign:"left",transition:"all .2s",
      gridColumn:(id==="exam"||id==="all")?"1/-1":"auto"}},
    e("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
      e("span",{style:{fontSize:"20px"}},md.emoji),
      e("div",{style:{minWidth:0}},
        e("div",{style:{fontWeight:700,fontSize:"14px",color:sel===id?md.color:"#e2e8f0"}},md.label),
        e("div",{style:{fontSize:"11px",color:"#64748b",marginTop:"1px"}},md.tag)),
      e("div",{style:{marginLeft:"auto",fontSize:"11px",color:"#64748b",fontWeight:700,whiteSpace:"nowrap"}},sub)
    ));
  return e("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",padding:"24px 16px"}},
    e("div",{style:card,className:"fade"},
      e("div",{style:{textAlign:"center",marginBottom:"22px"}},
        e("h1",{style:{fontSize:"25px",fontWeight:800,marginBottom:"6px"}},"ISTQB FL 퀴즈"),
        e("p",{style:{color:"#94a3b8",fontSize:"13px",lineHeight:1.7}},"공식 샘플문제 A v1.7 · ",
          e("strong",{style:{color:"#22c55e"}},`${total}문항`)," 전부 수록"),
        e("p",{style:{color:"#64748b",fontSize:"12px",marginTop:"4px"}},"AI가 만든 문제 없음 · 모든 문항에 실러버스 근거 절 표시")
      ),
      e("p",{style:{fontSize:"12px",fontWeight:700,color:"#64748b",letterSpacing:"1px",marginBottom:"10px"}},"📚 학습 모드"),
      e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"9px",marginBottom:"18px"}},
        ...CHAPTERS.map(c=>btn(c,"ch"+c.ch,`${countCh(c.ch)}문항`)),
        btn(EXAM_MODE,"exam",`${EXAM_N}문항`),
        btn(ALL_MODE,"all",`${total}문항`)
      ),
      e("div",{style:{background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",borderRadius:"11px",padding:"13px",fontSize:"12.5px",lineHeight:1.8,color:"#94a3b8",marginBottom:"4px"}},
        sel==="exam"
          ? "실제 시험과 같은 조건입니다. 장별 8·6·4·11·9·2문항으로 뽑고 60분 카운트다운이 돌아갑니다. 푸는 동안 정답과 해설은 보이지 않고, 제출 후 한꺼번에 공개됩니다. 합격선은 65%(26/40)입니다."
          : sel==="all"
          ? "공식 샘플문제 66문항 전부를 섞어서 풉니다. 본문 40문항이 커버하지 않는 LO(분기 커버리지·테스트 피라미드·리스크 관리 등)가 추가 26문항에 들어 있습니다."
          : `${m.label} ${m.tag} — ${countCh(parseInt(sel.replace("ch",""),10))}문항. 선택 즉시 정답과 선택지별 해설이 공개됩니다.`
      ),
      e("button",{style:primaryBtn(m.color),onClick:()=>onStart(sel)},`${m.emoji} ${m.label} 시작`),
      e("p",{style:{fontSize:"10.5px",color:"#475569",textAlign:"center",marginTop:"16px",lineHeight:1.7}},
        "출처: ISTQB® CTFL Sample Exam A v1.7 / 한글판 (사)KSTQB",e("br"),"학습용 비상업적 사용")
    )
  );
}

/* ── Quiz ── */
function Quiz({mode,onExit}){
  const info=modeInfo(mode);
  const examMode=mode==="exam";
  const [queue]=useState(()=>buildQueue(mode));
  const [idx,setIdx]=useState(0);
  const [answers,setAnswers]=useState({});   // idx → [letters]
  const [locked,setLocked]=useState({});     // idx → true (연습 모드 확정)
  const [done,setDone]=useState(false);
  const [left,setLeft]=useState(EXAM_SEC);
  const doneRef=useRef(false);

  useEffect(()=>{
    if(!examMode||done)return;
    const t=setInterval(()=>setLeft(s=>{
      if(s<=1){clearInterval(t); if(!doneRef.current){doneRef.current=true;setDone(true);} return 0;}
      return s-1;
    }),1000);
    return()=>clearInterval(t);
  },[examMode,done]);

  const q=queue[idx];
  if(!q) return e("div",{style:{padding:"40px",textAlign:"center"}},"문항이 없습니다.");
  const total=queue.length;
  const picked=answers[idx]||[];
  const show=!examMode&&!!locked[idx];
  const multi=isMulti(q);
  const need=ansArr(q).length;

  const graded=queue.map((qq,i)=>isRight(qq,answers[i]||[]));
  const liveC=graded.filter((ok,i)=>(examMode?false:locked[i])&&ok).length;
  const liveT=Object.keys(locked).length;

  function pick(letter){
    if(show)return;
    setAnswers(a=>{
      const cur=a[idx]||[];
      let nx;
      if(multi) nx=cur.includes(letter)?cur.filter(l=>l!==letter):(cur.length>=need?cur:[...cur,letter]);
      else nx=[letter];
      return{...a,[idx]:nx};
    });
    if(!multi&&!examMode) setLocked(l=>({...l,[idx]:true}));
  }
  function confirmMulti(){ if(picked.length===need) setLocked(l=>({...l,[idx]:true})); }
  function go(d){
    const n=idx+d;
    if(n<0)return;
    if(n>=total){ if(!doneRef.current){doneRef.current=true;setDone(true);} return; }
    setIdx(n);
  }

  if(done) return e(Result,{queue,answers,info,examMode,onExit});

  const mm=String(Math.floor(left/60)).padStart(2,"0"), ss=String(left%60).padStart(2,"0");
  const pct=Math.round(((idx+1)/total)*100);
  const answeredCnt=Object.keys(answers).filter(k=>(answers[k]||[]).length>0).length;

  return e("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",padding:"20px 16px"}},
    e("div",{style:card,className:"fade"},
      /* 상단바 */
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"8px"}},
        e("div",{style:{display:"flex",gap:"6px",alignItems:"center"}},
          e("span",{style:{fontSize:"15px"}},info.emoji),
          e("span",{style:{fontSize:"13px",color:info.color,fontWeight:700}},info.label)),
        e("div",{style:{display:"flex",gap:"9px",alignItems:"center"}},
          examMode
            ? e("span",{style:{fontSize:"15px",fontWeight:800,color:left<300?"#ef4444":"#f59e0b",fontVariantNumeric:"tabular-nums"}},`⏱ ${mm}:${ss}`)
            : e(React.Fragment,null,
                e("span",{style:{fontSize:"13px",color:"#22c55e",fontWeight:700}},`✅ ${liveC}`),
                e("span",{style:{fontSize:"13px",color:"#ef4444",fontWeight:700}},`❌ ${liveT-liveC}`)),
          e("button",{onClick:onExit,style:{...secBtn,padding:"6px 12px"}},"나가기"))
      ),
      /* 진행바 */
      e("div",{style:{marginBottom:"16px"}},
        e("div",{style:{height:"5px",background:"rgba(255,255,255,.07)",borderRadius:"99px",overflow:"hidden"}},
          e("div",{style:{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${info.color},#22c55e)`,borderRadius:"99px",transition:"width .4s"}})),
        e("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"11px",color:"#475569",marginTop:"4px"}},
          e("span",null,`${idx+1} / ${total} 문제`),
          e("span",null,examMode?`${answeredCnt}문항 답함`:`${pct}% 완료`))
      ),
      /* 문제 */
      e("div",{key:idx,className:"pop"},
        e("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap",marginBottom:"9px"}},
          badge(`Q${q.id}`,info.color),badge(`${q.ch}장`,"#94a3b8"),badge(q.lo,"#94a3b8"),badge(q.k,q.k==="K3"?"#f59e0b":"#94a3b8"),
          multi&&badge(`${need}개 선택`,"#ef4444")),
        e("p",{style:{fontSize:"16px",lineHeight:1.8,fontWeight:700,color:"#e2e8f0",marginBottom:"14px"}},q.question),
        e(Stem,{q}),
        e("div",{style:{display:"flex",flexDirection:"column",gap:"9px",marginTop:"12px"}},
          ...q.options.map(opt=>{
            const lt=opt[0];
            const isCh=picked.includes(lt), isOk=ansArr(q).includes(lt);
            return e("button",{key:opt,onClick:()=>pick(lt),style:optBtn(show,isOk,isCh)},
              `${show&&isOk?"✅ ":show&&isCh&&!isOk?"❌ ":isCh?"🔵 ":""}${opt}`);
          })),
        multi&&!show&&!examMode&&e("button",{style:{...primaryBtn(picked.length===need?info.color:"#475569")},onClick:confirmMulti},
          picked.length===need?"답안 확정":`${need}개를 선택하세요 (${picked.length}/${need})`),
        show&&e("div",{className:"fade"},e(Why,{q})),
        /* 이동 버튼 */
        e("div",{style:{display:"flex",gap:"9px",marginTop:"14px"}},
          examMode&&e("button",{style:{...secBtn,flex:1,textAlign:"center",padding:"12px",opacity:idx===0?.4:1},onClick:()=>go(-1),disabled:idx===0},"← 이전"),
          (examMode||show)&&e("button",{style:{...primaryBtn(info.color),flex:2,marginTop:0},onClick:()=>go(1)},
            idx+1<total?"다음 문제 →":(examMode?"제출하고 채점 🏁":"결과 보기 🏁")))
      )
    )
  );
}

/* ── Result ── */
function Result({queue,answers,info,examMode,onExit}){
  const [sw,setSw]=useState(true);
  const total=queue.length;
  const results=queue.map((q,i)=>({q,picked:answers[i]||[],ok:isRight(q,answers[i]||[])}));
  const correct=results.filter(r=>r.ok).length;
  const wrong=results.filter(r=>!r.ok);
  const pct=Math.round((correct/total)*100);
  const pass=pct>=PASS_PCT;
  const gc=pass?"#22c55e":pct>=50?"#f59e0b":"#ef4444";

  /* 장별 집계 */
  const byCh=CHAPTERS.map(c=>{
    const rs=results.filter(r=>r.q.ch===c.ch);
    return{...c,n:rs.length,ok:rs.filter(r=>r.ok).length};
  }).filter(c=>c.n>0);

  return e("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",padding:"24px 16px"}},
    e("div",{style:card,className:"fade"},
      e("div",{style:{textAlign:"center",marginBottom:"20px"}},
        e("div",{style:{fontSize:"48px",marginBottom:"6px"}},pass?"🏆":pct>=50?"📚":"💪"),
        e("div",{style:{fontSize:"13px",color:"#64748b",marginBottom:"4px"}},`${info.emoji} ${info.label} 결과`),
        e("div",{style:{fontSize:"44px",fontWeight:800,color:gc}},`${correct} / ${total}`),
        e("div",{style:{fontSize:"15px",color:gc,fontWeight:700,marginTop:"3px"}},`${pct}% · ${pass?"합격권":"불합격"}`),
        e("div",{style:{fontSize:"11.5px",color:"#64748b",marginTop:"4px"}},`합격 기준 ${PASS_PCT}%${examMode?" (26 / 40)":""}`)
      ),
      /* 장별 정답률 */
      e("div",{style:{marginBottom:"18px",display:"flex",flexDirection:"column",gap:"7px"}},
        ...byCh.map(c=>{
          const p=Math.round((c.ok/c.n)*100);
          return e("div",{key:c.ch,style:{display:"flex",alignItems:"center",gap:"9px"}},
            e("span",{style:{fontSize:"11.5px",color:"#94a3b8",width:"112px",flexShrink:0}},`${c.label} ${c.tag}`),
            e("div",{style:{flex:1,height:"7px",background:"rgba(255,255,255,.07)",borderRadius:"99px",overflow:"hidden"}},
              e("div",{style:{height:"100%",width:`${p}%`,background:p>=65?"#22c55e":p>=40?"#f59e0b":"#ef4444",borderRadius:"99px"}})),
            e("span",{style:{fontSize:"11.5px",color:"#cbd5e1",width:"46px",textAlign:"right",fontVariantNumeric:"tabular-nums"}},`${c.ok}/${c.n}`));
        })
      ),
      /* 오답노트 */
      wrong.length>0&&e("div",{style:{marginBottom:"14px"}},
        e("button",{onClick:()=>setSw(v=>!v),style:{...secBtn,width:"100%",textAlign:"center",padding:"11px"}},
          sw?"▲ 오답노트 닫기":`▼ 오답노트 보기 (틀린 ${wrong.length}문제)`),
        sw&&e("div",{className:"fade",style:{marginTop:"10px",display:"flex",flexDirection:"column",gap:"11px",maxHeight:"560px",overflowY:"auto",paddingRight:"4px"}},
          ...wrong.map((r,i)=>
            e("div",{key:i,style:{background:"rgba(239,68,68,.07)",border:"1px solid rgba(239,68,68,.2)",borderRadius:"12px",padding:"14px"}},
              e("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap",marginBottom:"8px"}},
                badge(`Q${r.q.id}`,"#ef4444"),badge(`${r.q.ch}장`,"#94a3b8"),badge(r.q.lo,"#f59e0b"),badge(r.q.ref,"#f59e0b"),badge(r.q.k,"#94a3b8")),
              e("div",{style:{fontSize:"12px",color:"#fca5a5",fontWeight:700,marginBottom:"7px"}},
                `내 답: ${r.picked.length?r.picked.join(", "):"무응답"} / 정답: ${ansArr(r.q).join(", ")}`),
              e("div",{style:{fontSize:"14px",color:"#e2e8f0",fontWeight:600,marginBottom:"9px",lineHeight:1.75}},r.q.question),
              e(Stem,{q:r.q}),
              e("div",{style:{display:"flex",flexDirection:"column",gap:"5px",marginTop:"8px"}},
                ...r.q.options.map(opt=>{
                  const lt=opt[0],ok=ansArr(r.q).includes(lt),mine=r.picked.includes(lt);
                  return e("div",{key:opt,style:{fontSize:"12.5px",lineHeight:1.7,color:ok?"#bbf7d0":mine?"#fecaca":"#94a3b8"}},
                    `${ok?"✅ ":mine?"❌ ":"　"}${opt}`);
                })),
              e(Why,{q:r.q})
            ))
        )
      ),
      e("div",{style:{display:"flex",gap:"9px"}},
        e("button",{style:{...secBtn,flex:1,textAlign:"center",padding:"12px"},onClick:onExit},"← 모드 선택"),
        e("button",{style:{...primaryBtn(info.color),flex:2,marginTop:0},onClick:()=>window.location.reload()},"🔄 다시 풀기"))
    )
  );
}

function App(){
  const [mode,setMode]=useState(null);
  if(!BANK.length) return e("div",{style:{padding:"50px",textAlign:"center",color:"#94a3b8"}},"문항 데이터를 불러오지 못했습니다. data/ 폴더를 확인하세요.");
  if(!mode) return e(Setup,{onStart:setMode});
  return e(Quiz,{mode,onExit:()=>setMode(null)});
}
ReactDOM.createRoot(document.getElementById("root")).render(e(App,null));
</script>
</body>
</html>
